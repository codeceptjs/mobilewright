name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run acceptance tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: mkdir -p output && adb logcat -c && DEBUG='mw:*' PLATFORM=android npx codeceptjs run --config test/integration/codecept.conf.js --steps || (adb logcat -d > output/logcat.txt; adb shell pm list packages > output/packages.txt; adb shell dumpsys activity activities > output/activities.txt; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-output
          path: output
