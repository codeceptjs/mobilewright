name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Unpack test app
        run: unzip -q test/data/TestApp-iphonesimulator.zip -d test/data -x '__MACOSX/*'
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;const all=Object.entries(d).filter(([r])=>r.includes("iOS")).flatMap(([,v])=>v);console.log(all.find(x=>x.name.startsWith("iPhone")).udid)')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "DEVICE_ID=$UDID" >> "$GITHUB_ENV"
      - name: Install mobilecli agent
        run: npx mobilecli agent install --device "$DEVICE_ID"
      - name: Run acceptance tests on simulator
        run: DEBUG='mw:*' PLATFORM=ios npx codeceptjs run --config test/integration/codecept.conf.js --steps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-output
          path: output
